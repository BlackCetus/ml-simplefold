_target_: datasets.train_datamodule.SimpleFoldTrainingDataModule

datasets:
  - _target_: datasets.train_datamodule.DatasetConfig
    data_name: pdb_data
    tokenized_dir: /e/project1/crescendo/reim1/datasets/openProteinSet/wds
    target_dir: /e/project1/crescendo/reim1/datasets/openProteinSet/wds
    manifest_path: /e/project1/crescendo/reim1/datasets/openProteinSet/wds/manifest.json
    cropper:
      _target_: boltz_data_pipeline.crop.boltz.BoltzCropper
      min_neighborhood: 0
      max_neighborhood: 40
    filters: []

  - _target_: datasets.train_datamodule.DatasetConfig
    data_name: swissprot
    tokenized_dir: /e/project1/crescendo/reim1/datasets/swissprot_stage/wds
    target_dir: /e/project1/crescendo/reim1/datasets/swissprot_stage/wds
    manifest_path: /e/project1/crescendo/reim1/datasets/swissprot_stage/wds/manifest.json
    cropper:
      _target_: boltz_data_pipeline.crop.boltz.BoltzCropper
      min_neighborhood: 0
      max_neighborhood: 40
    filters: []

  - _target_: datasets.train_datamodule.DatasetConfig
    data_name: processed_afesm_cluster
    tokenized_dir: /e/project1/crescendo/reim1/datasets/afesm_stage/wds
    target_dir: /e/project1/crescendo/reim1/datasets/afesm_stage/wds
    manifest_path: /e/project1/crescendo/reim1/datasets/afesm_stage/wds/manifest.json
    cluster: /e/project1/crescendo/reim1/datasets/afesm_stage/filtered_afesm_cluster.json
    cropper:
      _target_: boltz_data_pipeline.crop.boltz.BoltzCropper
      min_neighborhood: 0
      max_neighborhood: 40

filters:
    - _target_: boltz_data_pipeline.filter.dynamic.size.SizeFilter
      min_chains: 1
      max_chains: 300

tokenizer:
  _target_: boltz_data_pipeline.tokenize.boltz_protein.BoltzTokenizer

featurizer:
  _target_: boltz_data_pipeline.feature.featurizer.BoltzFeaturizer

symmetries: data/symmetry.pkl
max_tokens: 256
max_atoms: 2304
pad_to_max_tokens: False
pad_to_max_atoms: False
batch_size: 256
num_workers: 16
pin_memory: True
return_train_symmetries: False
min_dist: 2.0
max_dist: 22.0
num_bins: 64
atoms_per_window_queries: 32
rotation_augment_ref_pos: False
rotation_augment_coords: True